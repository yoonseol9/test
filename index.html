<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>우리들의 방명록</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header><div class="hero"><span>WELCOME</span><h1>우리들의 방명록</h1><p>방문해 주셔서 감사합니다.<br>여러분의 한마디를 남겨주세요.</p></div></header><main><section class="card"><h2>✏️ 방명록 작성</h2><form id="form"><input id="name" maxlength="20" placeholder="이름" required><textarea id="message" maxlength="200" placeholder="방문 후기를 자유롭게 남겨주세요!" required></textarea><div class="counter"><span id="count">0</span>/200</div><button>방명록 남기기</button></form></section><section><div class="title"><h2>💬 방명록</h2><span id="total">0개의 글</span></div><div id="status">공유 데이터베이스 연결 준비 중</div><div id="list"></div><div id="empty">아직 작성된 방명록이 없습니다.<br>첫 번째 방명록을 남겨보세요!</div></section></main><footer>© 2026 My Guestbook</footer><script src="script.js"></script></body></html>
